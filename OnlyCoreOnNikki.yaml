  - {name: 💬 AI平台, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 🎮 游戏平台, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
 
 # 最终兜底 & 工具组
  - {name: 🐟 漏网之鱼, type: select, proxies: [♻️ 智能优选, ♻️ 自动选择, 直连]}
  - {name: 🛑 广告拦截, type: select, proxies: [REJECT, 直连]}

  # 核心智能组（必须保留）
  - {name: ♻️ 智能优选, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 50, interval: 300}

  # 地区智能组（隐藏在界面，仅供后台调用和专用组引用）
  - {name: ♻️ 香港智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(港|HK|Hong|🇭🇰))^((?!(台|TW|日|JP|韩|KR|新|SG|美|US)).)*$", hidden: true, hide-in-ui: true}
  - {name: ♻️ 台湾智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(台|TW|Taiwan|🇹🇼))^((?!(港|HK|日|JP|韩|KR|新|SG|美|US)).)*$", hidden: true, hide-in-ui: true}
  - {name: ♻️ 日本智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(日|JP|Japan|🇯🇵))^((?!(港|HK|台|TW|韩|KR|新|SG|美|US)).)*$", hidden: true, hide-in-ui: true}
  - {name: ♻️ 狮城智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(新加坡|坡|狮城|SG|Singapore|🇸🇬))^((?!(港|HK|台|TW|韩|KR|日|JP|美|US)).)*$", hidden: true, hide-in-ui: true}
  - {name: ♻️ 美国智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(美|US|States|America|🇺🇸))^((?!(港|HK|台|TW|日|JP|韩|KR|新|SG)).)*$", hidden: true, hide-in-ui: true}  
  
  # 手动挑节点神器
  - {name: 🌐 全部节点, type: select, include-all: true}

# 规则集锚点
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# 规则集（已优化替换 404/失效链接为 2026 年稳定源）
rule-providers:
  fakeipfilter_domain: {<<: *domain, url: "https://raw.githubusercontent.com/wwqgtxx/clash-rules/release/fakeip-filter.mrs"}
  private_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"}
  proxylite: {<<: *class, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"}  # 替换原仓库（已失效），用 Loyalsoldier 稳定 proxy 规则
  youtube_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs"}
  github_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs"}
  tiktok_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs"}
  speedtest_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/ookla-speedtest.mrs"}
  geolocation-!cn: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs"}
  cn_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"}

  private_ip: {<<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"}
  cn_ip: {<<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"}
  google_ip: {<<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs"}
  telegram_ip: {<<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs"}
  netflix_ip: {<<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/netflix.mrs"}
  apple_ip: {<<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo-lite/geoip/apple.mrs"}

  # 重合部分：统一替换为 MetaCubeX 稳定 .mrs 版本（高效、无 404）
  apple_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs"}
  google_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs"}
  microsoft_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs"}
  onedrive_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/onedrive.mrs"}
  telegram_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs"}
  netflix_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs"}
  paypal_domain: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/paypal.mrs"}  # MetaCubeX 有 paypal

  # 广告拦截：保留 ACL4SSR BanAD（当前仍可用），用 cdn 加速防 EOF
  banad: {<<: *class, url: "https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanAD.list"}
  banprogramad: {<<: *class, url: "https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanProgramAD.list"}

  # AI 平台：MetaCubeX 有 openai 和 category-ai-!cn
  ai_platform: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs"}
  openai: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/openai.mrs"}

  # 游戏平台：MetaCubeX 无专用游戏集，精简为常用（Steam 等用 MetaCubeX 覆盖，或删除不必要）
  # 若需更多游戏规则，可后续添加 Loyalsoldier/games.txt；这里保留 Steam 并用 MetaCubeX 替代部分
  steam: {<<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.mrs"}  # 若无，可删除 RULE-SET,steam
  # 其他游戏（epic/origin/sony 等 ACL4SSR 已失效）：建议删除对应 RULE-SET，或用 Loyalsoldier/proxy 兜底
  # epic: 删除（无稳定源）
  # origin: 删除
  # sony: 删除
  # ubisoft: 删除（404）
  # battlenet: 删除（404）
  # nintendo: 删除

  # 国内 Steam 直连：ACL4SSR SteamCN.list 当前不可用，替换为 Loyalsoldier/direct 或 MetaCubeX cn
  steamcn_domain: {<<: *domain, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"}  # 临时用 direct 替代，或删除手动直连域名

# 规则匹配
rules:
  # 1. 狭义直连
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,cn_ip,直连
  - RULE-SET,private_domain,直连
  
  # 2. 狭义代理
  - DOMAIN,a.haiyucloud.com,🚀 默认代理
  - DOMAIN-SUFFIX,haiyucloud.com,🚀 默认代理
  - RULE-SET,apple_ip,🍎 Apple
  - RULE-SET,google_ip,🍀 Google
  - RULE-SET,netflix_ip,🎥 NETFLIX
  - RULE-SET,telegram_ip,📲 Telegram

  # 广告拦截
  - RULE-SET,banad,🛑 广告拦截
  - RULE-SET,banprogramad,🛑 广告拦截
  
  # 国内游戏/常见 CDN 直连
  - RULE-SET,steamcn_domain,直连  # 若 steamcn_domain 也失效，可删除这行
  - DOMAIN-SUFFIX,qq.com,直连
  - DOMAIN-SUFFIX,tencent.com,直连
  - DOMAIN-SUFFIX,netease.com,直连
  - DOMAIN-SUFFIX,wanmei.com,直连
  - DOMAIN-SUFFIX,163.com,直连

  # 国际游戏平台代理（仅保留 steam，其他已删除对应 provider）
  - RULE-SET,steam,🎮 游戏平台

  # 3. 广义国际服务
  - RULE-SET,proxylite,🚀 默认代理
  - RULE-SET,ai_platform,💬 AI平台
  - RULE-SET,openai,💬 AI平台
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,paypal_domain,💶 PayPal
  - RULE-SET,speedtest_domain,✈️ Speedtest
  - RULE-SET,apple_domain,🍎 Apple
  
  # 4. 兜底
  - RULE-SET,geolocation-!cn,🚀 默认代理
  - RULE-SET,cn_domain,直连
  - MATCH,🐟 漏网之鱼

