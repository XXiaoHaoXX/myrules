# 必读！！！
# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 跑裸核用户请自行去掉下方控制面板模块的注释。
#此模板为FAKE-ip +tun 混合模式
#此配置为nikki仅核心运行配置，请根据自己的插件修改
#机场链接拉取方式默认为直连，可根据机场情况修改为默认代理
#确保自己的代理工具是smart内核！！！！！！！！！！！
#确保自己的代理工具是smart内核！！！！！！！！！！！
#确保自己的代理工具是smart内核！！！！！！！！！！！
proxy-providers:
#可以替换成任意名称
  机场订阅:
#替换成自己的订阅链接    
    url: "订阅链接"
    输入: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
#直连没法拉取可改为🚀 默认代理，反之亦然       
    proxy: "直连"
    override:
      additional-prefix: "01 |"
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
#多个链接可以参照上面，仅修改机场名字和订阅链接，其余复制粘贴即可（从  机场订阅  到    User-Agent  为止）

# 节点信息
proxies:
  - {name: 直连, type: direct}

# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块（裸核请取消注释）。
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探（fakeip下其实可以不用嗅探）
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站（非裸核最后3项改为false）
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:fakeipfilter_domain
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# 出站策略组
proxy-groups:
  # 主力 & 高频组（保留 全部节点 方便手动测试）
  - {name: 🚀 默认代理, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
