# ================================================
# 我的 Clash 完美配置模板（2026 版）
# 特点：
# - LightGBM 全局智能优选（自动选最佳节点）
# - 高频组支持手动挑节点（全部节点）
# - 日常组支持手动挑节点 + 强制地区
# - 地区智能组隐藏（界面清爽，下拉可见）
# - MetaCubeX + Loyalsoldier 稳定规则
# - 去广告 + Fake-IP TUN 模式
# 使用方法：
# 用订阅转换工具（如 https://acl4ssr-sub.github.io/）
# - 填入你的订阅链接
# - 远程配置填本文件 raw URL
# - 输出 Clash 格式即可
# ================================================

# 机场订阅（请在此处填入你的订阅链接，支持多个）
proxy-providers:
  订阅1:  # ← 改成你想要的名字（如 机场A）
    url: "https://your-subscribe-link1.com/clash"  # ← 替换为你的订阅链接
    输入: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
    proxy: "🚀 默认代理"   # 拉取订阅时走代理，避免直连失败
    override:
      additional-prefix: "订阅1 |"  # 节点名前缀，可自定义区分来源
    headers:
      User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

  # 如需添加更多订阅，直接复制上面一段，改名和 url 即可
  # 订阅2:
  #   url: "https://your-subscribe-link2.com/clash"
  #   type: http
  #   interval: 86400
  #   health-check:
  #     enable: true
  #     url: https://www.gstatic.com/generate_204
  #     interval: 600
  #   proxy: "🚀 默认代理"
  #   override:
  #     additional-prefix: "订阅2 |"
  #   headers:
  #     User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

# 直连节点
proxies:
  - {name: 直连, type: direct}

# 全局配置
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# TUN 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS（Fake-IP 模式）
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - rule-set:fakeipfilter_domain
  default-nameserver:
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# 出站策略组（你的最终版）
proxy-groups:
  # 主力 & 高频组（保留全部节点 + 地区智能）
  - {name: 🚀 默认代理, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 📹 YouTube, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 🎵 TikTok, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 🎥 NETFLIX, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}

  # 日常专用组（全支持手动挑节点 + 强制地区）
  - {name: 🍀 Google, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 🤖 ChatGPT, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 👨🏿‍💻 GitHub, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 🐬 OneDrive, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 🪟 Microsoft, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 📲 Telegram, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: ✈️ Speedtest, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 💶 PayPal, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 🍎 Apple, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 💬 AI平台, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  - {name: 🎮 游戏平台, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}

  # 兜底 & 工具
  - {name: 🐟 漏网之鱼, type: select, proxies: [♻️ 智能优选, ♻️ 自动选择, 直连]}
  - {name: 🛑 广告拦截, type: select, proxies: [REJECT, 直连]}

  # 核心智能组
  - {name: ♻️ 智能优选, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 50, interval: 300}

  # 地区智能组（隐藏，主界面不显示，仅下拉可见）
  - {name: ♻️ 香港智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(港|HK|Hong|🇭🇰))^((?!(台|TW|日|JP|韩|KR|新|SG|美|US)).)*$", hidden: true, hide-in-ui: true}
  - {name: ♻️ 台湾智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(台|TW|Taiwan|🇹🇼))^((?!(港|HK|日|JP|韩|KR|新|SG|美|US)).)*$", hidden: true, hide-in-ui: true}
  - {name: ♻️ 日本智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(日|JP|Japan|🇯🇵))^((?!(港|HK|台|TW|韩|KR|新|SG|美|US)).)*$", hidden: true, hide-in-ui: true}
  - {name: ♻️ 狮城智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(新加坡|坡|狮城|SG|Singapore|🇸🇬))^((?!(港|HK|台|TW|韩|KR|日|JP|美|US)).)*$", hidden: true, hide-in-ui: true}
  - {name: ♻️ 美国智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(美|US|States|America|🇺🇸))^((?!(港|HK|台|TW|日|JP|韩|KR|新|SG)).)*$", hidden: true, hide-in-ui: true}

  # 手动挑节点
  - {name: 🌐 全部节点, type: select, include-all: true}

# 规则集锚点
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# 规则集（稳定源）
rule-providers:
  fakeipfilter_domain: {<<: *domain, url: "https://cdn.jsdelivr.net/gh/wwqgtxx/clash-rules/release/fakeip-filter.mrs"}
  private_domain: {<<: *domain, url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"}
  proxylite: {<<: *class, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"}
  youtube_domain: {<<: *domain, url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs"}
