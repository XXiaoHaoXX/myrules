  - {name: ✈️ Speedtest, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
