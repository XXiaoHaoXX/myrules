# ----------------------------------------------------------------------
# OpenClash 配置模板
# 文件名: openclash_template.yaml
# 用途: 导入机场订阅后，自动套用自定义的代理组、规则锚点和Rule Providers。
# ----------------------------------------------------------------------

# 1. 核心占位符：节点将拉取到这里 (OpenClash 订阅转换时自动填充)
proxies: []
proxy-providers: {}

# 2. 规则锚点 (Rule Anchor)
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: text}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: text}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# 3. 代理组 (Proxy-Groups)
proxy-groups:
  # 🎯 核心入口组
  - {name: 🚀 默认代理, type: select, proxies: [♻️ 智能优选, 🌐 全部节点, ♻️ 自动选择, ♻️ 香港智能, ♻️ 台湾智能, ♻️ 日本智能, ♻️ 狮城智能, ♻️ 美国智能, 直连]}
  
  # 🤖 AI 服务 专用组
  - {name: 🤖 AI 服务, type: select, proxies: [♻️ 智能优选, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🌐 全部节点, ♻️ 自动选择, 直连]}
  
  # 🎥 NETFLIX 专用组
  - {name: 🎥 NETFLIX, type: select, proxies: [♻️ 智能优选, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇺🇸 美国节点, 🇸🇬 狮城节点, 🌐 全部节点, ♻️ 自动选择, 直连]}
  
  # 📹 YouTube 专用组
  - {name: 📹 YouTube, type: select, proxies: [♻️ 智能优选, 🇯🇵 日本节点, 🇺🇸 美国节点, 🇸🇬 狮城节点, 🌐 全部节点, ♻️ 自动选择, 直连]}
  
  # 🎵 TikTok 专用组
  - {name: 🎵 TikTok, type: select, proxies: [♻️ 智能优选, 🇺🇸 美国节点, 🇯🇵 日本节点, 🌐 全部节点, ♻️ 自动选择, 直连]}
  
  # 🐟 兜底组
  - {name: 🐟 漏网之鱼, type: select, proxies: [♻️ 智能优选, ♻️ 自动选择, 直连]}
  
  # ⚙️ 全局智能/自动选择组 
  - {name: ♻️ 智能优选, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 50, interval: 300}
  - {name: 🌐 全部节点, type: select, include-all: true}
  
  # 🌏 地区智能组 
  - {name: ♻️ 香港智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(港|HK|Hong|🇭🇰))^((?!(台|TW|日|JP|韩|KR|新|SG|美|US)).)*$"}
  - {name: ♻️ 台湾智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(台|TW|Taiwan|🇹🇼))^((?!(港|HK|日|JP|韩|KR|新|SG|美|US)).)*$"}
  - {name: ♻️ 日本智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(日|JP|Japan|🇯🇵))^((?!(港|HK|台|TW|韩|KR|新|SG|美|US)).)*$"}
  - {name: ♻️ 狮城智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(新加坡|坡|狮城|SG|Singapore|🇸🇬))^((?!(港|HK|台|TW|韩|KR|日|JP|美|US)).)*$"}
  - {name: ♻️ 美国智能, type: smart, uselightgbm: true, collectdata: true, lazy: true, include-all: true, interval: 300, filter: "(?=.*(美|US|States|America|🇺🇸))^((?!(港|HK|台|TW|日|JP|韩|KR|新|SG)).)*$"}
  
  # 📍 地区手动选择组 
  - {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?=.*(港|HK|Hong|🇭🇰))^((?!(台|TW|日|JP|韩|KR|新|SG|美|US)).)*$"}
  - {name: 🇹🇼 台湾节点, type: select, include-all: true, filter: "(?=.*(台|TW|Taiwan|🇹🇼))^((?!(港|HK|日|JP|韩|KR|新|SG|美|US)).)*$"}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?=.*(日|JP|Japan|🇯🇵))^((?!(港|HK|台|TW|韩|KR|新|SG|美|US)).)*$"}
  - {name: 🇸🇬 狮城节点, type: select, include-all: true, filter: "(?=.*(新加坡|坡|狮城|SG|Singapore|🇸🇬))^((?!(港|HK|台|TW|韩|KR|日|JP|美|US)).)*$"}
  - {name: 🇺🇸 美国节点, type: select, include-all: true, filter: "(?=.*(美|US|States|America|🇺🇸))^((?!(港|HK|台|TW|日|JP|韩|KR|新|SG)).)*$"}

# 4. 规则提供者 (Rule Providers)
rule-providers:
  # ----------------- 国内直连规则 -----------------
  private_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list"
  cn_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list"
    append-rules:
      - GEOIP,CN
  private_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list"
  cn_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list"
    append-rules:
      - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list
      - GEOSITE,CN
  steam_cn:
    <<: *domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list"

  # ----------------- 国际服务规则 (Domain) -----------------
  ai_services:
    <<: *domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list"
    append-rules:
      - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
      - RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
  youtube_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list"
  netflix_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list"
  tiktok_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/TikTok.list"
  google_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list"
  github_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list"
  onedrive_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OneDrive/OneDrive.list"
  microsoft_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list"
  telegram_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list"
  paypal_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PayPal/PayPal.list"
  speedtest_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Speedtest.list"
  apple_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list"

  # ----------------- 国际服务规则 (IP/CIDR) -----------------
  netflix_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/NetflixIP.list"
  google_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google_ip.list"
  telegram_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram_ip.list"
  apple_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/AppleIP.list"
    
  # ----------------- 兜底规则 (Classical) -----------------
  proxylite:
    <<: *class
    url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list"
  geolocation_non_cn:
    type: file
    behavior: classical
    path: ./ruleset/geolocation-!cn.yaml
    append-rules:
      - GEOSITE,geolocation-!cn

# 5. 规则 (Rules)
rules:
  # >>>>> 1. 强制直连 - 优先级最高 <<<<<
  - RULE-PROVIDER,private_ip,直连
  - RULE-PROVIDER,cn_ip,直连 
  - RULE-PROVIDER,private_domain,直连
  
  # >>>>> 2. 国内域名/游戏直连 - 强化 Steam 和 PoE 直连 <<<<<
  - DOMAIN-KEYWORD,steamcontent.com,直连
  - DOMAIN-SUFFIX,steamcdn-a.akamaihd.net,直连
  - DOMAIN-SUFFIX,pathofexile.com,直连
  - DOMAIN-SUFFIX,pathofexile.cn,直连
  - RULE-PROVIDER,cn_domain,直连
  - RULE-PROVIDER,steam_cn,直连 
  - DOMAIN-SUFFIX,warframe.com,直连
  - DOMAIN-SUFFIX,digitalextremes.com,直连
  - DOMAIN-SUFFIX,qq.com,直连
  
  # >>>>> 3. 精确服务代理 - 独立 Select 组 (精确优先) <<<<<
  - RULE-PROVIDER,ai_services,🤖 AI 服务
  - RULE-PROVIDER,youtube_domain,📹 YouTube
  - RULE-PROVIDER,netflix_domain,🎥 NETFLIX
  - RULE-PROVIDER,netflix_ip,🎥 NETFLIX 
  - RULE-PROVIDER,tiktok_domain,🎵 TikTok
  
  # >>>>> 4. 国际服务 - 通用 Select 组 (精确优先) <<<<<
  - RULE-PROVIDER,google_domain,🚀 默认代理
  - RULE-PROVIDER,github_domain,🚀 默认代理
  - RULE-PROVIDER,onedrive_domain,🚀 默认代理
  - RULE-PROVIDER,microsoft_domain,🚀 默认代理
  - RULE-PROVIDER,telegram_domain,🚀 默认代理
  - RULE-PROVIDER,paypal_domain,🚀 默认代理
  - RULE-PROVIDER,speedtest_domain,🚀 默认代理
  - RULE-PROVIDER,apple_domain,🚀 默认代理
  
  - RULE-PROVIDER,google_ip,🚀 默认代理
  - RULE-PROVIDER,telegram_ip,🚀 默认代理
  - RULE-PROVIDER,apple_ip,🚀 默认代理
  
  # >>>>> 5. 兜底/最后捕获 (通用靠后) <<<<<
  - RULE-PROVIDER,proxylite,🚀 默认代理 
  - RULE-PROVIDER,geolocation_non_cn,🚀 默认代理
  - MATCH,🐟 漏网之鱼